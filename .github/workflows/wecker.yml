# Hält das kostenlose Supabase-Projekt wach (es wird sonst nach 7 Tagen ohne Nutzung pausiert).
# Die Adresse und der Publishable key sind öffentlich (stehen auch in js/config.js).
name: Supabase wach halten
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST "https://mdyilzfqzmrkbgqafemk.supabase.co/rest/v1/rpc/student_login" \
            -H "apikey: sb_publishable_C6YLxYO8oTHIAkw1bQaTvg_mPi1gMUf" -H "Content-Type: application/json" -d '{"p_code":"WECKER-0000"}'
